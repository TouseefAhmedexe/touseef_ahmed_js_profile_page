<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Profile page of Touseef Ahmed built with HTML, CSS and JavaScript. The profile data is shown from a JavaScript object.">
    <meta name="author" content="Touseef Ahmed">
    <title>Touseef Ahmed | Dynamic Profile</title>
</head>

<body>
    <header class="site-header">
        <img class="profile-photo" src="images/profile.jpg" alt="Touseef Ahmed wearing a dark suit and tie" width="144" height="144">
        <h1 id="profile-name"></h1>
        <p class="profile-role" id="profile-role"></p>
        <p id="profile-greeting"></p>
        <p id="profile-place"></p>
    </header>

    <nav class="site-nav">
        <ul>
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#lookup">Lookup</a></li>
            <li><a href="#education">Education</a></li>
            <li><a href="#experience">Experience</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#achievements">Awards</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section class="section" id="about">
            <h2>About</h2>
            <p id="about-summary"></p>
            <p id="latest-role"></p>
            <p id="experience-message"></p>

            <h3>At a Glance</h3>
            <div class="stat-grid" id="stat-grid"></div>

            <h3>Skills by Category</h3>
            <ul class="tag-list" id="category-counts"></ul>
        </section>
    </main>
</body>

</html>
